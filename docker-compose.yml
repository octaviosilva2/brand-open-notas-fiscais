services:
  nginx:
    image: nginx:1.27-alpine
    container_name: brand-open-notas-fiscais
    restart: unless-stopped
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - api
    expose:
      - "80"
    networks:
      - easypanel
      - backend

  frontend:
    container_name: brand-open-notas-fiscais-front
    image: ghcr.io/${GITHUB_REPOSITORY}-front:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - backend

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    env_file: ./backend/.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    container_name: brand-open-notas-fiscais-api
    image: ghcr.io/${GITHUB_REPOSITORY}-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: "1"
    restart: unless-stopped
    env_file: ./backend/.env
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - egress
    command: >
      sh -c "alembic upgrade head &&
             exec uvicorn app.main:app --host 0.0.0.0 --port 8000"

  cron:
    image: alpine:3.19
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      - API_URL=http://api:8000
    command: >
      sh -c "echo '0 8 * * * wget -qO- --header=\"X-Cron-Secret: $$CRON_SECRET\"
      --post-data=\"\" $$API_URL/cron/run' | crontab - && crond -f -l 2"
    depends_on:
      - api
    networks:
      - backend

networks:
  backend:
    internal: true
  egress:
  easypanel:
    external: true
    name: easypanel

volumes:
  pgdata:
