[project]
name = "brand-open-notas-fiscais-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "cryptography>=42.0",
    "httpx>=0.28.1",
    "pydantic[email]>=2.13.0",
    "pydantic-settings>=2.13.1",
    "signxml>=4.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "fastapi>=0.135.3",
    "uvicorn>=0.44.0",
    "python-multipart>=0.0.26",
    "python-jose>=3.5.0",
    "passlib>=1.7.4",
    "bcrypt==4.3.0",
    "aiosmtplib>=3.0",
]

worker = [
    "celery[redis]>=5.6.3",
]

[dependency-groups]
dev = [
    "lxml-stubs>=0.5",
    "mypy>=1.20.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.15.12",
    "types-passlib>=1.7.7.20260211",
    "types-python-jose>=3.5.0.20260408",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort (ordena imports)
    "N",    # pep8-naming
    "UP",   # pyupgrade (sintaxe moderna)
    "B",    # flake8-bugbear (bugs comuns)
    "C4",   # comprehensions melhores
    "SIM",  # simplificações
    "RUF",  # regras do próprio ruff
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]  # imports não usados em __init__ são ok (re-export)
# O contrato InfDps espelha os nomes de tag do leiaute da DPS (mixedCase),
# então os campos do modelo precisam manter o nome original do XML/JSON.
"app/modules/recurrences/domain/inf_dps.py" = ["N815"]

[tool.ruff.format]
quote-style = "double"


[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]

# afrouxando pra projetos reais não morrerem em ruído
warn_return_any = false
disallow_untyped_decorators = false  # FastAPI tem decorators sem tipo

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false  # testes podem ser mais relaxados

[[tool.mypy.overrides]]
module = ["signxml", "signxml.*"]
ignore_errors = true


[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
